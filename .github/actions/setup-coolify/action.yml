name: Setup Coolify
description: Start a local Coolify instance for acceptance and scenario tests

inputs:
  coolify-env-file:
    description: Path to write Coolify credentials (COOLIFY_ENDPOINT, COOLIFY_TOKEN, COOLIFY_SERVER_UUID)
    required: false
    default: /tmp/coolify-env
  coolify-data-dir:
    description: Root directory for Coolify data
    required: false
    default: /home/runner/coolify-data
  coolify-image-tag:
    description: >
      Docker image tag for coollabsio/coolify (LATEST_IMAGE in compose).
      Default edge is the multi-arch tip of Coolify v4.x and includes
      VolumeBackupsController (coollabsio/coolify#10946). Stable latest / 4.2.0
      do not. If edge is flaky, pin a multi-arch SHA from Coolify's
      coolify-sha-build (e.g. sha-<full-git-sha> on docker.io/ghcr.io).
      Use latest only when you intentionally want the older stable API surface.
    required: false
    default: edge

runs:
  using: composite
  steps:
    - name: Wait for Coolify images (or pull now)
      shell: bash
      env:
        COOLIFY_DATA_DIR: ${{ inputs.coolify-data-dir }}
        COOLIFY_IMAGE_TAG: ${{ inputs.coolify-image-tag }}
      run: |
        set -euo pipefail
        # Early job steps may have already run prepare-pull-bg so Go/Terraform
        # setup overlaps the image pull. If not, do prepare+ssh+pull here.
        if [ -d /tmp/coolify-pull ]; then
          bash scripts/ci-coolify-boot.sh wait-pull
        else
          bash scripts/ci-coolify-boot.sh prepare
          bash scripts/ci-coolify-boot.sh ssh
          bash scripts/ci-coolify-boot.sh pull
        fi

    - name: Start Coolify
      shell: bash
      env:
        COOLIFY_DATA_DIR: ${{ inputs.coolify-data-dir }}
        COOLIFY_IMAGE_TAG: ${{ inputs.coolify-image-tag }}
      run: |
        set -euo pipefail
        bash scripts/ci-coolify-boot.sh up

    - name: Cache Playwright browsers
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: playwright-cache
      with:
        # Playwright stores browsers under this path on Linux CI.
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('.github/requirements/playwright.txt') }}

    - name: Install Playwright (overlaps Coolify boot)
      shell: bash
      run: |
        set -euo pipefail
        pip install --require-hashes -r .github/requirements/playwright.txt
        if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
          # Browsers cached; still need OS deps (not in the browser cache).
          playwright install-deps chromium
        else
          playwright install --with-deps chromium
        fi

    - name: Wait for Coolify to be ready
      shell: bash
      env:
        COOLIFY_DATA_DIR: ${{ inputs.coolify-data-dir }}
      run: |
        set -euo pipefail
        bash scripts/ci-coolify-boot.sh wait-ready

    - name: Bootstrap Coolify test fixtures
      shell: bash
      env:
        COOLIFY_ENV_FILE: ${{ inputs.coolify-env-file }}
      run: |
        set -euo pipefail
        # Hard cap so a hung Playwright register cannot eat the 45m job
        # timeout (seen on #795: Setup Coolify 44.6m, terraform test never ran).
        if command -v timeout >/dev/null 2>&1; then
          timeout --foreground 300 ./scripts/setup-coolify-test.sh
        else
          ./scripts/setup-coolify-test.sh
        fi

    - name: Verify Coolify API health
      shell: bash
      env:
        COOLIFY_ENV_FILE: ${{ inputs.coolify-env-file }}
      run: |
        set -euo pipefail
        set -a; source "$COOLIFY_ENV_FILE"; set +a
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
          -H "Authorization: Bearer $COOLIFY_TOKEN" \
          -H "Accept: application/json" \
          "$COOLIFY_ENDPOINT/api/v1/version")
        if [ "$HTTP_CODE" != "200" ]; then
          echo "::error::Coolify API health check failed (HTTP $HTTP_CODE)"
          docker compose -f "${{ inputs.coolify-data-dir }}/source/docker-compose.yml" logs --tail=30
          exit 1
        fi
        echo "Coolify API healthy (HTTP $HTTP_CODE)"
