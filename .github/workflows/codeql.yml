# CodeQL security analysis
# Recipe A: PR + weekly schedule + dispatch. No push-to-main rebuild.
# Every language uploads SARIF, including on release-please heads.
# A Go stand-in makes CodeQL (go) green without a scanning result, and
# the main code scanning ruleset then blocks the release merge.
name: CodeQL

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"  # Weekly Monday 4am UTC
  workflow_dispatch:
    inputs:
      analyze_sha:
        description: Commit SHA to check out and attach Code Scanning results to
        required: false
        type: string
      analyze_ref:
        description: Git ref for analyze_sha (for example refs/pull/845/head)
        required: false
        type: string

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [go, python, actions]
        include:
          - language: go
            build-mode: manual
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.analyze_sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          cache: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          dependency-caching: true
      - name: Build (Go)
        if: matrix.build-mode == 'manual'
        run: GOFIPS140=latest go build ./...
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: "!inputs.analyze_sha"
        with:
          category: "/language:${{ matrix.language }}"
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: "inputs.analyze_sha != ''"
        with:
          category: "/language:${{ matrix.language }}"
          sha: ${{ inputs.analyze_sha }}
          ref: ${{ inputs.analyze_ref }}
