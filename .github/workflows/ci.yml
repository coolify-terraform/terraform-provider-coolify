# Runs on GitHub-hosted runners (ubuntu-latest). To switch back to
# self-hosted runners, see git history before this commit for the
# full self-hosted config (fork safety guards, PATH normalization,
# Docker credential workarounds, python3.9 pinning, cache: false).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 6am UTC (security scanners)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'schedule'
    outputs:
      go: ${{ steps.filter.outputs.go }}
      docs: ${{ steps.filter.outputs.docs }}
      terraform: ${{ steps.filter.outputs.terraform }}
      ci: ${{ steps.filter.outputs.ci }}
      scripts: ${{ steps.filter.outputs.scripts }}
      scenarios: ${{ steps.filter.outputs.scenarios }}
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - 'testdata/**'
            docs:
              - 'templates/**'
              - 'docs/**'
              - '*.md'
              # release-please / release override files: not provider docs.
              # Matching them alone must not force full Validate (fmt, docs gen,
              # Trivy, Gitleaks) on every version-bump PR.
              - '!CHANGELOG.md'
              - '!RELEASE_NOTES.md'
            terraform:
              - 'examples/**/*.tf'
            ci:
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - 'scripts/ci-unit-packages.sh'
              - 'scripts/ci-acc-packages.sh'
              - 'scripts/ci-coolify-boot.sh'
              - '.codecov.yml'
              - '.goreleaser.yml'
              - 'GNUmakefile'
            scripts:
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            scenarios:
              # Product + scenario HCL + the runner script. Do not include
              # ci.yml alone: every workflow-only PR was running Coolify
              # scenario jobs. Edit the job via workflow_dispatch or after
              # an internal/scenarios/runner change when you need that matrix.
              - 'internal/**'
              - 'examples/scenarios/**'
              - 'scripts/run-scenario-tests.sh'

  dco:
    name: DCO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check DCO sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          for sha in $(git rev-list --no-merges "${BASE_SHA}"..HEAD); do
            author=$(git log -1 --format='%an' "$sha")
            if [[ "$author" == *"[bot]" ]]; then
              echo "Skipping bot commit $sha by $author"
              continue
            fi
            if ! git log -1 --format='%B' "$sha" | grep -qi '^Signed-off-by:'; then
              echo "::error::Commit $sha by $author is missing Signed-off-by"
              exit 1
            fi
          done
          echo "All commits have DCO sign-off"

  test:
    name: Test
    runs-on: ubuntu-latest
    # Sharded wall clock is ~max(heaviest package) plus sibling work, not full suite.
    timeout-minutes: 20
    permissions:
      contents: read
      # gotestsum binary cache save
      actions: write
    needs: changes
    if: >-
      always() &&
      (
        needs.changes.outputs.go == 'true' ||
        needs.changes.outputs.ci == 'true' ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch'
      )
    strategy:
      fail-fast: false
      matrix:
        # Four shards: exclusive pin of the four heaviest packages, then
        # round-robin the rest. Application UnitTests are compiled twice
        # (shards 0 and 1) with complementary ci_app_a / ci_app_b tags.
        shard: [0, 1, 2, 3]
    env:
      UNIT_SHARD_COUNT: "4"
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
          terraform_version: "1.15.x"
      # Binary release is faster than `go install` (~8s) and cache hits are ~0s.
      - name: Cache gotestsum
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/gotestsum
          key: gotestsum-1.13.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install gotestsum
        env:
          GOTESTSUM_VERSION: "1.13.0"
        run: |
          set -euo pipefail
          BIN_DIR="${HOME}/.local/bin"
          mkdir -p "$BIN_DIR"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          if [ -x "$BIN_DIR/gotestsum" ] && "$BIN_DIR/gotestsum" --version 2>/dev/null | grep -q "$GOTESTSUM_VERSION"; then
            echo "gotestsum ${GOTESTSUM_VERSION} restored from cache"
            exit 0
          fi
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) ARCH="amd64" ;;
            aarch64|arm64) ARCH="arm64" ;;
          esac
          URL="https://github.com/gotestyourself/gotestsum/releases/download/v${GOTESTSUM_VERSION}/gotestsum_${GOTESTSUM_VERSION}_${OS}_${ARCH}.tar.gz"
          TMP="$(mktemp)"
          curl -sfL --retry 3 --retry-delay 2 --retry-all-errors -o "$TMP" "$URL"
          tar xzf "$TMP" -C "$BIN_DIR" gotestsum
          rm -f "$TMP"
          gotestsum --version
      - name: Run tests
        run: |
          set -euo pipefail
          mkdir -p test-results coverage
          # -parallel=1 is required for packages that fork terraform under -race
          # (TSAN + fork/exec). See commit 39f893d. -p 4 still runs packages
          # concurrently within the shard.
          mapfile -t pkgs < <(bash scripts/ci-unit-packages.sh "${{ matrix.shard }}" "${UNIT_SHARD_COUNT}")
          echo "Shard ${{ matrix.shard }}/${UNIT_SHARD_COUNT}: ${#pkgs[@]} packages"
          printf '  %s\n' "${pkgs[@]}"
          # Complementary application test-file slices. Other packages ignore
          # these tags. Without a tag (shards 2/3) application is not selected.
          extra_tags=()
          case "${{ matrix.shard }}" in
            0) extra_tags=(-tags=ci_app_a) ;;
            1) extra_tags=(-tags=ci_app_b) ;;
          esac
          if [ "${#extra_tags[@]}" -gt 0 ]; then
            echo "Application split tags: ${extra_tags[*]}"
          fi
          # gotestsum --packages wants a space-separated list (not commas).
          pkg_list="${pkgs[*]}"
          test_args=(-race -cover -coverprofile="coverage/coverage-shard-${{ matrix.shard }}.out" -count=1 -p 4 -parallel=1 -timeout=15m)
          if [ "${#extra_tags[@]}" -gt 0 ]; then
            test_args=("${extra_tags[@]}" "${test_args[@]}")
          fi
          gotestsum \
            --format pkgname \
            --junitfile "test-results/unit-shard-${{ matrix.shard }}.xml" \
            --rerun-fails \
            --rerun-fails-max-failures=5 \
            --packages "$pkg_list" \
            -- "${test_args[@]}"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
      - name: Upload coverage shard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/
          retention-days: 3
          if-no-files-found: ignore

  # Merge sharded coverage and publish once (avoids three competing uploads).
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, test]
    if: >-
      always() &&
      needs.test.result == 'success' &&
      (
        needs.changes.outputs.go == 'true' ||
        needs.changes.outputs.ci == 'true' ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: read
      actions: read
      code-quality: write
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-shard-*
          path: coverage-shards
          merge-multiple: true
      - name: Cache gocover-cobertura
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/gocover-cobertura
          key: gocover-cobertura-1.5.0-${{ runner.os }}-${{ runner.arch }}
      - name: Merge coverage and summarize
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(coverage-shards/coverage-shard-*.out)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No coverage shard files found"
            ls -laR coverage-shards || true
            exit 1
          fi
          echo "mode: atomic" > coverage.out
          for f in "${files[@]}"; do
            # Drop the mode line from each shard profile.
            tail -n +2 "$f" >> coverage.out || true
          done
          go tool cover -func=coverage.out | tail -1
          BIN_DIR="${HOME}/.local/bin"
          mkdir -p "$BIN_DIR"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          if [ ! -x "$BIN_DIR/gocover-cobertura" ]; then
            GOBIN="$BIN_DIR" go install github.com/boumenot/gocover-cobertura@v1.5.0
          fi
          "$BIN_DIR/gocover-cobertura" < coverage.out > coverage.xml
      - name: Upload coverage
        if: >-
          always() &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1.4.2
        with:
          file: coverage.xml
          language: Go
          label: code-coverage/go
          # Upload succeeds; GitHub processing can hang beyond the default 160s and
          # fail an otherwise green unit-test job. Do not gate CI on that infra wait.
          fail-on-error: false
          wait-for-processing-timeout: 300

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: >-
      always() &&
      (
        needs.changes.outputs.go == 'true' ||
        needs.changes.outputs.ci == 'true' ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch'
      )
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
      - name: Check go mod tidy
        if: ${{ !cancelled() }}
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Verify module checksums
        if: ${{ !cancelled() }}
        run: go mod verify
      - name: Cache govulncheck
        if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/govulncheck
          key: govulncheck-1.3.0-${{ runner.os }}-${{ runner.arch }}
      - name: Govulncheck
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          BIN_DIR="${HOME}/.local/bin"
          mkdir -p "$BIN_DIR"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          if [ ! -x "$BIN_DIR/govulncheck" ]; then
            GOBIN="$BIN_DIR" go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          fi
          "$BIN_DIR/govulncheck" ./...
      # goreleaser-action downloads the binary from GitHub releases; CDN
      # flakes (socket hang up) should not fail the whole Lint job. Real
      # .goreleaser.yml breakage still surfaces on the release workflow.
      - name: GoReleaser check
        if: ${{ !cancelled() && (needs.changes.outputs.ci == 'true' || github.event_name == 'workflow_dispatch') }}
        id: goreleaser-check
        continue-on-error: true
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> 2"
          args: check
      - name: Warn if GoReleaser check failed
        if: ${{ steps.goreleaser-check.outcome == 'failure' }}
        run: |
          echo "::warning::GoReleaser check failed (often a GitHub releases download flake). Config is still validated on the release workflow."

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: >-
      always() &&
      (
        needs.changes.outputs.go == 'true' ||
        needs.changes.outputs.docs == 'true' ||
        needs.changes.outputs.terraform == 'true' ||
        needs.changes.outputs.ci == 'true' ||
        needs.changes.outputs.scripts == 'true' ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch'
      )
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
          terraform_version: "1.15.x"
      # OpenTofu GitHub releases occasionally return 503 (CDN flake). Terraform
      # already formats examples; tofu fmt is a second opinion, not a hard gate.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        id: setup-tofu
        continue-on-error: true
        with:
          tofu_wrapper: false
      - name: Check HCL formatting
        if: ${{ !cancelled() }}
        run: terraform fmt -check -recursive examples/
      - name: Check HCL formatting (OpenTofu)
        if: ${{ !cancelled() && steps.setup-tofu.outcome == 'success' }}
        run: tofu fmt -check -recursive examples/
      - name: Warn if OpenTofu install failed
        if: ${{ steps.setup-tofu.outcome == 'failure' }}
        run: |
          echo "::warning::OpenTofu install failed (likely GitHub releases CDN flake). HCL fmt already checked with terraform."
      - name: Check generated docs
        if: ${{ !cancelled() }}
        run: |
          cd tools && go install github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.25.0 && cd ..
          go generate ./...
          git diff --exit-code
      - name: API Coverage doc
        if: ${{ !cancelled() }}
        run: make api-coverage && git diff --exit-code API_COVERAGE.md
      - name: Verify AGENTS.md counts
        if: ${{ !cancelled() }}
        run: make counts-check
      - name: Install actionlint
        if: ${{ !cancelled() && (needs.changes.outputs.ci == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: GOBIN="$(pwd)/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint GitHub Actions workflows
        if: ${{ !cancelled() && (needs.changes.outputs.ci == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: make actionlint-check
      - name: Run Python script tests
        if: ${{ !cancelled() && (needs.changes.outputs.scripts == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: |
          python3 --version
          make python-test
      - name: Trivy filesystem scan
        if: ${{ !cancelled() }}
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
      - name: Retry Trivy with cached DB
        if: ${{ !cancelled() && steps.trivy.outcome == 'failure' }}
        run: |
          if trivy fs . --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed --skip-db-update 2>/dev/null; then
            echo "::warning::Trivy DB download failed but scan passed with cached DB"
          else
            echo "::error::Trivy scan failed (tried fresh download and cached DB)"
            exit 1
          fi
      - name: Cache gitleaks
        if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/gitleaks
          key: gitleaks-8.30.1-${{ runner.os }}-${{ runner.arch }}
      # Download can flake (empty archive / socket hang from GitHub releases).
      # Retry to a temp file before tar; do not pipe curl into tar.
      - name: Gitleaks
        if: ${{ !cancelled() }}
        env:
          GIT_BEFORE: ${{ github.event.before }}
          GIT_AFTER: ${{ github.event.after }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          VER="8.30.1"
          BIN_DIR="$HOME/.local/bin"
          export PATH="$BIN_DIR:$PATH"
          mkdir -p "$BIN_DIR"
          if ! command -v gitleaks >/dev/null 2>&1 || ! gitleaks version 2>/dev/null | grep -q "$VER"; then
            OS=$(uname -s | tr '[:upper:]' '[:lower:]')
            ARCH=$(uname -m)
            case "$ARCH" in x86_64) ARCH="x64" ;; aarch64|arm64) ARCH="arm64" ;; esac
            URL="https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_${OS}_${ARCH}.tar.gz"
            TMP="$(mktemp)"
            ok=0
            for attempt in 1 2 3; do
              if curl -sfL --retry 3 --retry-delay 2 --retry-all-errors -o "$TMP" "$URL" \
                && tar tzf "$TMP" gitleaks >/dev/null 2>&1 \
                && tar xzf "$TMP" -C "$BIN_DIR" gitleaks; then
                ok=1
                break
              fi
              echo "::warning::Gitleaks download/extract failed (attempt ${attempt}/3)"
              sleep $((attempt * 2))
            done
            rm -f "$TMP"
            if [ "$ok" != "1" ]; then
              echo "::error::Failed to install gitleaks v${VER} after 3 attempts (GitHub releases flake)"
              exit 1
            fi
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            gitleaks detect --source . --config .gitleaks.toml --log-opts="${PR_BASE_SHA}..HEAD" --exit-code 1
          elif [ "$EVENT_NAME" = "push" ]; then
            gitleaks detect --source . --config .gitleaks.toml --log-opts="${GIT_BEFORE}..${GIT_AFTER}" --exit-code 1
          else
            gitleaks detect --source . --config .gitleaks.toml --exit-code 1
          fi

  contract-freshness:
    name: Contract Freshness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for contract drift
        id: contract-check
        run: |
          git clone --depth 1 https://github.com/coollabsio/coolify.git /tmp/coolify-src
          python3 scripts/extract-contract.py /tmp/coolify-src \
            --version v4-latest \
            --output /tmp/coolify-latest-contract.json
          python3 -c "
          import json, sys
          with open('testdata/contracts/coolify-v4.json') as f:
              pinned = json.load(f)
          with open('/tmp/coolify-latest-contract.json') as f:
              latest = json.load(f)
          changes = []
          # Check model field drift
          for model in sorted(set(list(pinned.get('models', {})) + list(latest.get('models', {})))):
              pf = set(pinned.get('models', {}).get(model, {}).get('fields', {}).keys())
              lf = set(latest.get('models', {}).get(model, {}).get('fields', {}).keys())
              for f in sorted(lf - pf):
                  changes.append(f'+ {model}.{f}')
              for f in sorted(pf - lf):
                  changes.append(f'- {model}.{f}')
          # Check route drift
          pinned_routes = {(r['method'], r['path']) for r in pinned.get('routes', [])}
          latest_routes = {(r['method'], r['path']) for r in latest.get('routes', [])}
          for method, path in sorted(latest_routes - pinned_routes):
              changes.append(f'+ route {method} {path}')
          for method, path in sorted(pinned_routes - latest_routes):
              changes.append(f'- route {method} {path}')
          if changes:
              print(f'Contract drift: {len(changes)} changes')
              for c in changes[:50]:
                  print(f'  {c}')
              if len(changes) > 50:
                  print(f'  ... and {len(changes) - 50} more')
              sys.exit(1)
          print('Contract is up to date')
          " || echo "contract_drift=true" >> "$GITHUB_OUTPUT"
      - name: Create issue for contract drift
        if: steps.contract-check.outputs.contract_drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create contract-drift --description "Upstream Coolify source contract has changed" --color "d93f0b" --force 2>/dev/null || true
          BODY_FILE=.github/contract-freshness-issue.md
          EXISTING=$(gh issue list --label "contract-drift" --state open --json number --jq length)
          if [ "$EXISTING" = "0" ]; then
            gh issue create \
              --title "Upstream Coolify contract has changed" \
              --label "contract-drift" \
              --body-file "$BODY_FILE"
          fi
          # When a drift issue is already open, do not re-post the same checklist
          # every week (noise). The open issue already carries the taxonomy body.

  scenario-tests:
    name: Scenario Tests
    runs-on: ubuntu-latest
    # core is short; github-cicd waits up to 15m on deploy; hetzner creates VMs.
    timeout-minutes: 25
    needs: [changes]
    if: >-
      always() &&
      (
        needs.changes.outputs.scenarios == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    strategy:
      fail-fast: false
      matrix:
        suite: [core, github-cicd, hetzner]
    permissions:
      contents: read
      # Playwright browser cache save in setup-coolify.
      actions: write
    env:
      COOLIFY_DATA_DIR: /home/runner/coolify-data
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether this suite needs Coolify
        id: need
        env:
          GITHUB_APP_ID: ${{ secrets.COOLIFY_GITHUB_APP_APP_ID }}
          HETZNER_TOKEN: ${{ secrets.COOLIFY_HETZNER_TOKEN }}
        run: |
          case "${{ matrix.suite }}" in
            core)
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
            github-cicd)
              if [ -n "$GITHUB_APP_ID" ]; then
                echo "run=true" >> "$GITHUB_OUTPUT"
              else
                echo "run=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            hetzner)
              if [ -n "$HETZNER_TOKEN" ]; then
                echo "run=true" >> "$GITHUB_OUTPUT"
              else
                echo "run=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "::error::unknown suite ${{ matrix.suite }}"
              exit 1
              ;;
          esac
      - name: Skip suite (secrets not configured)
        if: steps.need.outputs.run != 'true'
        run: |
          echo "SKIP suite ${{ matrix.suite }} (matching secret empty, no Coolify boot)"
      - name: Start Coolify image pull
        if: steps.need.outputs.run == 'true'
        env:
          COOLIFY_DATA_DIR: /home/runner/coolify-data
        run: bash scripts/ci-coolify-boot.sh prepare-pull-bg
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.need.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.need.outputs.run == 'true'
        with:
          terraform_wrapper: false
          terraform_version: "1.15.x"
      - name: Build and install provider locally
        if: steps.need.outputs.run == 'true'
        run: |
          GOFIPS140=latest go build -o terraform-provider-coolify .
          PLUGIN_DIR="$HOME/.terraform.d/plugins/coolify-terraform/coolify/0.0.0-dev/$(go env GOOS)_$(go env GOARCH)"
          mkdir -p "$PLUGIN_DIR"
          cp terraform-provider-coolify "$PLUGIN_DIR/"
          cat > "$HOME/.terraformrc" <<EOF
          provider_installation {
            dev_overrides {
              "coolify-terraform/coolify" = "$PLUGIN_DIR"
            }
            direct {}
          }
          EOF

      - name: Setup Coolify
        if: steps.need.outputs.run == 'true'
        uses: ./.github/actions/setup-coolify

      - name: Generate deploy key for scenarios
        if: steps.need.outputs.run == 'true'
        run: |
          rm -f /tmp/scenario-deploy-key /tmp/scenario-deploy-key.pub
          ssh-keygen -t rsa -b 2048 -f /tmp/scenario-deploy-key -N "" -q
          DEPLOY_KEY=$(cat /tmp/scenario-deploy-key)
          {
            echo "TF_VAR_deploy_ssh_key<<EOFKEY"
            echo "$DEPLOY_KEY"
            echo "EOFKEY"
            echo "TF_VAR_deploy_key<<EOFKEY2"
            echo "$DEPLOY_KEY"
            echo "EOFKEY2"
          } >> "$GITHUB_ENV"
      - name: Run scenario tests
        if: steps.need.outputs.run == 'true'
        env:
          SCENARIO_SUITE: ${{ matrix.suite }}
          # GitHub App scenarios (acme-github-cicd)
          TF_VAR_github_app_private_key: ${{ secrets.COOLIFY_GITHUB_APP_PRIVATE_KEY }}
          TF_VAR_github_app_id: ${{ secrets.COOLIFY_GITHUB_APP_APP_ID }}
          TF_VAR_github_app_installation_id: ${{ secrets.COOLIFY_GITHUB_APP_INSTALLATION_ID }}
          TF_VAR_github_app_client_id: ${{ secrets.COOLIFY_GITHUB_APP_CLIENT_ID }}
          TF_VAR_github_app_client_secret: ${{ secrets.COOLIFY_GITHUB_APP_CLIENT_SECRET }}
          TF_VAR_git_repository: ${{ secrets.COOLIFY_GITHUB_APP_REPOSITORY }}
          # Hetzner scenarios (acme-hetzner-infra)
          TF_VAR_hetzner_api_token: ${{ secrets.COOLIFY_HETZNER_TOKEN }}
        run: |
          # Load bootstrapped Coolify credentials
          set -a
          source /tmp/coolify-env
          set +a
          export TF_VAR_coolify_endpoint="$COOLIFY_ENDPOINT"
          export TF_VAR_coolify_token="$COOLIFY_TOKEN"
          export TF_VAR_server_uuid="$COOLIFY_SERVER_UUID"

          bash scripts/run-scenario-tests.sh --suite "${{ matrix.suite }}"

      - name: Capture Coolify logs on failure
        if: failure() && steps.need.outputs.run == 'true'
        run: |
          docker compose -f "$COOLIFY_DATA_DIR/source/docker-compose.yml" \
            logs --timestamps > /tmp/coolify-logs.txt 2>&1 || true
      - name: Upload Coolify logs
        if: failure() && steps.need.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coolify-logs-scenario-tests-${{ matrix.suite }}
          path: |
            /tmp/coolify-logs.txt
            /tmp/scenario-diag/
          if-no-files-found: ignore
          retention-days: 7

  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: >-
      always() &&
      (
        needs.changes.outputs.go == 'true' ||
        needs.changes.outputs.ci == 'true' ||
        needs.changes.outputs.scripts == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    strategy:
      fail-fast: false
      matrix:
        # Two Coolify instances. Application acc is pinned on shard 0;
        # service acc on shard 1; remaining TestAcc packages round-robin.
        shard: [0, 1]
    permissions:
      contents: read
      # Playwright browser cache save in setup-coolify.
      actions: write
    env:
      COOLIFY_DATA_DIR: /home/runner/coolify-data
      ACC_SHARD_COUNT: "2"
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start Coolify image pull
        env:
          COOLIFY_DATA_DIR: /home/runner/coolify-data
        run: bash scripts/ci-coolify-boot.sh prepare-pull-bg
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
          terraform_version: "1.15.x"

      - name: Setup Coolify
        uses: ./.github/actions/setup-coolify

      - name: Cache gotestsum
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/gotestsum
          key: gotestsum-1.13.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install gotestsum
        env:
          GOTESTSUM_VERSION: "1.13.0"
        run: |
          set -euo pipefail
          BIN_DIR="${HOME}/.local/bin"
          mkdir -p "$BIN_DIR"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          if [ -x "$BIN_DIR/gotestsum" ] && "$BIN_DIR/gotestsum" --version 2>/dev/null | grep -q "$GOTESTSUM_VERSION"; then
            echo "gotestsum ${GOTESTSUM_VERSION} restored from cache"
            exit 0
          fi
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) ARCH="amd64" ;;
            aarch64|arm64) ARCH="arm64" ;;
          esac
          URL="https://github.com/gotestyourself/gotestsum/releases/download/v${GOTESTSUM_VERSION}/gotestsum_${GOTESTSUM_VERSION}_${OS}_${ARCH}.tar.gz"
          TMP="$(mktemp)"
          curl -sfL --retry 3 --retry-delay 2 --retry-all-errors -o "$TMP" "$URL"
          tar xzf "$TMP" -C "$BIN_DIR" gotestsum
          rm -f "$TMP"
          gotestsum --version
      - name: Run acceptance tests
        env:
          # External secrets for tests that need real cloud APIs
          COOLIFY_HETZNER_TOKEN: ${{ secrets.COOLIFY_HETZNER_TOKEN }}
          COOLIFY_GITHUB_APP_APP_ID: ${{ secrets.COOLIFY_GITHUB_APP_APP_ID }}
          COOLIFY_GITHUB_APP_INSTALLATION_ID: ${{ secrets.COOLIFY_GITHUB_APP_INSTALLATION_ID }}
          COOLIFY_GITHUB_APP_CLIENT_ID: ${{ secrets.COOLIFY_GITHUB_APP_CLIENT_ID }}
          COOLIFY_GITHUB_APP_CLIENT_SECRET: ${{ secrets.COOLIFY_GITHUB_APP_CLIENT_SECRET }}
          COOLIFY_GITHUB_APP_PRIVATE_KEY: ${{ secrets.COOLIFY_GITHUB_APP_PRIVATE_KEY }}
          COOLIFY_GITHUB_APP_PRIVATE_KEY_FILE: ${{ secrets.COOLIFY_GITHUB_APP_PRIVATE_KEY_FILE }}
          COOLIFY_GITHUB_APP_REPOSITORY: ${{ secrets.COOLIFY_GITHUB_APP_REPOSITORY }}
          COOLIFY_GITHUB_APP_BRANCH: ${{ secrets.COOLIFY_GITHUB_APP_BRANCH }}
          # PR CI boots edge: tip-only APIs (S3, volume backup) must exist.
          COOLIFY_REQUIRE_TIP_APIS: "1"
        run: |
          # Load credentials from bootstrap
          set -a
          source /tmp/coolify-env
          set +a
          export TF_ACC=1

          mapfile -t pkgs < <(bash scripts/ci-acc-packages.sh "${{ matrix.shard }}" "${ACC_SHARD_COUNT}")
          echo "Acc shard ${{ matrix.shard }}/${ACC_SHARD_COUNT}: ${#pkgs[@]} packages"
          printf '  %s\n' "${pkgs[@]}"
          pkg_list="${pkgs[*]}"

          mkdir -p test-results
          gotestsum \
            --format pkgname \
            --junitfile "test-results/acceptance-shard-${{ matrix.shard }}.xml" \
            --packages "$pkg_list" \
            -- -run TestAcc -race -count=1 -timeout=30m -parallel=1
      - name: Upload acceptance test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: acceptance-test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

      - name: Capture Coolify logs on failure
        if: failure()
        run: |
          docker compose -f "$COOLIFY_DATA_DIR/source/docker-compose.yml" \
            logs --timestamps > /tmp/coolify-logs.txt 2>&1 || true
      - name: Upload Coolify logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coolify-logs-acceptance-tests-shard-${{ matrix.shard }}
          path: /tmp/coolify-logs.txt
          retention-days: 7

  ci-pass:
    name: CI
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # coverage is best-effort for the GitHub code-quality upload; do not gate
    # merge on it (upload already uses fail-on-error: false).
    needs: [dco, test, lint, validate, scenario-tests, acceptance-tests]
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Check results
        run: |
          results='${{ toJSON(needs.*.result) }}'
          if echo "$results" | grep -qE '"failure"|"cancelled"'; then
            echo "::error::One or more CI jobs failed"
            echo "$results"
            exit 1
          fi