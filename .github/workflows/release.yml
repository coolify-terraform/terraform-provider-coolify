name: Release

on:
  # Recipe A/E: cheap release-please on push to main (no product compile).
  # GoReleaser is the one trusted compile at release_created.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0) -- only for manual re-runs"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # W9: after Recipe A, PR setup-go caches do not populate the default-branch
  # cache. Write the shared Go module cache here with no product compile.
  cache-go:
    name: Cache Go modules
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # Use a GitHub App token so that release-please PR pushes trigger
      # pull_request events (GITHUB_TOKEN suppresses them, which prevents
      # CI and auto-approve from running on the release PR).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.AUTO_APPROVE_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_APPROVE_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

  release:
    name: Release
    needs: release-please
    # always() required: release-please is skipped on workflow_dispatch
    if: >-
      always() && !failure() && !cancelled() &&
      (needs.release-please.outputs.release_created == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
      # SLSA provenance / GitHub attestations for Scorecard Signed-Releases.
      id-token: write
      attestations: write
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify tag is on main
        run: |
          if ! git branch -r --contains HEAD | grep -q 'origin/main'; then
            echo "::error::Tag does not point to a commit on main branch"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Syft for SBOM generation
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      # Smoke test and goreleaser check live in PR CI. This job is the
      # one trusted compile at release_created (Recipe E).
      - name: Clean existing release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          for asset in $(gh release view "$TAG" --json assets \
              --jq '.assets[].name' 2>/dev/null || true); do
            echo "Deleting existing asset: $asset"
            gh release delete-asset "$TAG" "$asset" -y || true
          done
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
      # Build provenance (attune/patchloom pattern). Scorecard Signed-Releases
      # looks for .intoto.jsonl (or sigstore) on the GitHub Release; GPG
      # checksum signatures alone score 8/10 without provenance.
      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Attest checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*_SHA256SUMS
      - name: Upload attestation bundles to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          mkdir -p attestation-bundles
          shopt -s nullglob
          for asset in dist/*.zip dist/*_SHA256SUMS; do
            [ -f "$asset" ] || continue
            name=$(basename "$asset")
            tmpdir=$(mktemp -d)
            pushd "$tmpdir" >/dev/null
            if gh attestation download "$OLDPWD/$asset" \
              --repo "${{ github.repository }}" 2>/dev/null; then
              for bundle in *.jsonl; do
                [ -f "$bundle" ] || continue
                cp "$bundle" "$OLDPWD/attestation-bundles/${name}.intoto.jsonl"
                break
              done
            fi
            popd >/dev/null
            rm -rf "$tmpdir"
          done
          if ls attestation-bundles/*.intoto.jsonl 1>/dev/null 2>&1; then
            gh release upload "$TAG" attestation-bundles/*.intoto.jsonl --clobber
          else
            echo "::warning::No attestation bundles produced; Scorecard provenance may stay incomplete"
          fi
      # Curated notes live on release-note-<semver> or in Actions vars.
      # Apply after the GitHub Release exists (release-please created it;
      # GoReleaser uploaded assets). Missing source leaves the auto
      # changelog. continue-on-error so a notes miss does not fail publish.
      - name: Apply curated release notes
        continue-on-error: true
        env:
          TAG: ${{ env.RELEASE_TAG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NOTES: ${{ vars.RELEASE_NOTES }}
          RELEASE_NOTES_TAG: ${{ vars.RELEASE_NOTES_TAG }}
        run: bash scripts/apply-release-notes.sh