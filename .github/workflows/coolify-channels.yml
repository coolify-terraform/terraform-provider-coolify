# Coolify channel watch: stable CDN, nightly CDN, GitHub releases, source tip
# version (config/constants.php), and tip contract API drift vs pin.
# Goal: open/update issues early enough to finish provider work before stable ships.
# Lesson from v4.3.0: CDN nightly can stay on the previous line until release day
# while tip already carries next-line API fields.
name: Coolify Channels

on:
  schedule:
    # Every 6 hours (was daily; 4.3.0 shipped between daily runs with no prior CDN bump)
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: coolify-channels
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Watch channels + tip API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract Coolify tip contract (default branch)
        run: |
          set -euo pipefail
          # Fresh tip extract for API drift detection (version strings can lag tip).
          make contract-extract VERSION=latest
          test -f testdata/contracts/coolify-v4-latest.json

      - name: Check Coolify channels and open/update issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/check-coolify-channels.py \
            --fetch \
            --fetch-prereleases \
            --fetch-latest-release \
            --fetch-tip-version \
            --contract testdata/contracts/coolify-v4.json \
            --tip-contract testdata/contracts/coolify-v4-latest.json \
            --json \
            --apply \
            > /tmp/coolify-channels-decision.json

      - name: Summary
        if: always()
        run: |
          if [ -f /tmp/coolify-channels-decision.json ]; then
            {
              echo "### Coolify channel decision"
              echo ""
              echo '```json'
              cat /tmp/coolify-channels-decision.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f testdata/contracts/coolify-v4-latest.json ]; then
            {
              echo ""
              echo "### Tip vs pin (contract diff)"
              echo ""
              echo '```'
              scripts/diff-contracts.sh \
                testdata/contracts/coolify-v4.json \
                testdata/contracts/coolify-v4-latest.json || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
