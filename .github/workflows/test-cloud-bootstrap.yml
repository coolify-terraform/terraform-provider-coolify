name: Test Cloud Bootstrap
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-cloud-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-coolify

      - name: Test API
        run: |
          set -euo pipefail
          echo "=== ENV FILE ==="
          cat /tmp/coolify-env
          echo "=== API TEST ==="
          set -a; source /tmp/coolify-env; set +a
          curl -v -H "Authorization: Bearer $COOLIFY_TOKEN" -H "Accept: application/json" "$COOLIFY_ENDPOINT/api/v1/version"
          echo ""
          curl -s -H "Authorization: Bearer $COOLIFY_TOKEN" -H "Accept: application/json" "$COOLIFY_ENDPOINT/api/v1/servers" | head -200