name: Test Cloud Bootstrap
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-cloud-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start Coolify image pull
        env:
          COOLIFY_DATA_DIR: /home/runner/coolify-data
        run: bash scripts/ci-coolify-boot.sh prepare-pull-bg

      - uses: ./.github/actions/setup-coolify

      - name: Test API
        run: |
          set -euo pipefail
          echo "=== ENV FILE ==="
          cat /tmp/coolify-env
          echo "=== API TEST ==="
          set -a; source /tmp/coolify-env; set +a
          curl -v -H "Authorization: Bearer $COOLIFY_TOKEN" -H "Accept: application/json" "$COOLIFY_ENDPOINT/api/v1/version"
          echo ""
          curl -s -H "Authorization: Bearer $COOLIFY_TOKEN" -H "Accept: application/json" "$COOLIFY_ENDPOINT/api/v1/servers" | head -200