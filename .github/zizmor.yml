# zizmor configuration
# https://docs.zizmor.sh/configuration/

rules:
  # Allow tag refs (SHA pinning remains preferred). See ci-workflow-hygiene Rule 9.
  unpinned-uses:
    config:
      policies:
        "*": ref-pin

  # pull_request_target / workflow_run without checkout of untrusted code.
  dangerous-triggers:
    ignore:
      - dependabot-auto-merge.yml
      - pr-title.yml
      - release.yml

  # Same-repo head is required. github.actor is the triggering user
  # (maintainer re-run), not the PR author.
  bot-conditions:
    ignore:
      - auto-approve.yml

  # setup-go module cache on a tag / workflow_run release, not a PR.
  cache-poisoning:
    ignore:
      - release.yml

  # Workflow-defined matrix cells and trusted job/env values, not PR input.
  template-injection:
    ignore:
      - coolify-nightly.yml
      - release.yml

  # Local composite action. `./.github/actions/...` is the same-repo path
  # GitHub has always accepted. `$/.github/actions/...` is equivalent.
  self-repository:
    ignore:
      - ci.yml
      - coolify-nightly.yml
      - test-cloud-bootstrap.yml

  # GitHub App tokens are required so GITHUB_TOKEN does not suppress
  # pull_request events (release-please) and so Settings uploads work
  # (social preview). zizmor 1.30+ flags create-github-app-token as
  # error[github-app]; the pin is hash-pinned.
  github-app:
    ignore:
      - release.yml
      - update-social-preview.yml
